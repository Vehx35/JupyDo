# Builds the JupyDo hub image for amd64 and arm64 from the vendored files only (the builder's
# vendor/hub, from the Zenodo record named in main/first_start.sh, with build-hub.sh: no
# network during the build), and publishes it on ghcr.io as <owner>/jupydo-hub:<commit> and
# :<branch>; :latest only for main, so a branch can be tried (JUPYDO_HUB_TAG=<branch>, see
# compose.yaml) before it is merged. first_start.sh downloads it ready-made.
name: hub-image

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write


jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm   # native arm64 (free for public repositories)
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name (ghcr.io wants it lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/jupydo-hub" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The vendored files of the hub, from Zenodo
        run: |
          RECORD="$(sed -n 's/^ *JUPYDO_VENDOR_RECORD="\([0-9]*\)".*/\1/p' main/first_start.sh)"
          [ -n "$RECORD" ] || { echo "::error::JUPYDO_VENDOR_RECORD is not set in main/first_start.sh: publish the builder's vendor bundles on Zenodo first (jupydo-builder scripts/publish-zenodo.py)"; exit 1; }
          BASE="https://zenodo.org/records/$RECORD/files"
          mkdir -p /tmp/zenodo /tmp/vendor
          curl -fsSL -o /tmp/zenodo/SHA256SUMS "$BASE/SHA256SUMS?download=1"
          curl -fsSL -o /tmp/zenodo/vendor-hub.tar "$BASE/vendor-hub.tar?download=1"
          (cd /tmp/zenodo && grep ' vendor-hub.tar$' SHA256SUMS | sha256sum -c -)
          tar -xf /tmp/zenodo/vendor-hub.tar -C /tmp/vendor
      - name: Build (no network) and push
        run: |
          JUPYDO_HUB_TAG=build ./main/build-hub.sh /tmp/vendor
          docker tag ghcr.io/vehx35/jupydo-hub:build $IMAGE:${{ github.sha }}-${{ matrix.arch }}
          docker push $IMAGE:${{ github.sha }}-${{ matrix.arch }}

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Image name (ghcr.io wants it lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/jupydo-hub" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: One image for both architectures
        run: |
          BRANCH="$(echo "${GITHUB_REF_NAME}" | tr -c 'a-zA-Z0-9_.-\n' '-')"
          TAGS="-t $IMAGE:${{ github.sha }} -t $IMAGE:$BRANCH"
          [ "$GITHUB_REF_NAME" = main ] && TAGS="$TAGS -t $IMAGE:latest"
          docker buildx imagetools create $TAGS $IMAGE:${{ github.sha }}-amd64 $IMAGE:${{ github.sha }}-arm64
          docker buildx imagetools inspect $IMAGE:${{ github.sha }}
