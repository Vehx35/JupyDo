# Builds the JupyDo hub image (main/Dockerfile.jupyterhub) for amd64 and arm64 and publishes
# it on ghcr.io as <owner>/jupydo-hub:<commit> and :<branch>; :latest only for main, so a
# branch can be tried (JUPYDO_HUB_TAG=<branch>, see compose.yaml) before it is merged.
# first_start.sh downloads it ready-made; `docker compose up -d --build` builds it locally.
name: hub-image

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write


jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm   # native arm64 (free for public repositories)
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name (ghcr.io wants it lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/jupydo-hub" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        run: |
          docker buildx build --platform linux/${{ matrix.arch }} -f main/Dockerfile.jupyterhub \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t $IMAGE:${{ github.sha }}-${{ matrix.arch }} --push main

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Image name (ghcr.io wants it lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/jupydo-hub" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: One image for both architectures
        run: |
          BRANCH="$(echo "${GITHUB_REF_NAME}" | tr -c 'a-zA-Z0-9_.-\n' '-')"
          TAGS="-t $IMAGE:${{ github.sha }} -t $IMAGE:$BRANCH"
          [ "$GITHUB_REF_NAME" = main ] && TAGS="$TAGS -t $IMAGE:latest"
          docker buildx imagetools create $TAGS $IMAGE:${{ github.sha }}-amd64 $IMAGE:${{ github.sha }}-arm64
          docker buildx imagetools inspect $IMAGE:${{ github.sha }}
