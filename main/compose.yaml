services:
  jupyterhub:
    # Built by GitHub (.github/workflows/hub-image.yml) from the vendored files and
    # downloaded ready-made by first_start.sh; ./build-hub.sh builds it here instead, from
    # the same vendored files, without internet. JUPYDO_HUB_TAG=<branch> (in .env or the
    # shell) uses the image of a branch, to try it before merging.
    image: ghcr.io/vehx35/jupydo-hub:${JUPYDO_HUB_TAG:-latest}
    container_name: jupyterhub #container name
    env_file:
      - .env
    ports:
      - "8000:8000" # exposes the JupyterHub service on port 8000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Lets dockerspawn use the Docker socket
      - ${JUPYDO_DATA_PATH:-/srv/JupyDo/jupyterhub_data}:/etc/jupyterhub # Persistent data jupyterhub
      - ./branding:/etc/jupydo-branding:ro # logo.png and terms.pdf of this installation (edit them there)
      - ${JUPYDO_PATH:-/srv/JupyDo}/jh_shared:/srv/jh_shared # Shared directory for user notebooks
      - ${JUPYDO_PATH:-/srv/JupyDo}/builder:/srv/jupydo-builder:ro # Image builder: Dockerfile, modules/, vendor/
      - ${JUPYDO_PATH:-/srv/JupyDo}/logs/cells:/srv/jupydo-logs/cells # Cell log (only if enabled in first_start.sh)
    networks:
      - jupyterhub_network
    restart: always # Restart the container if it stops

  # Network connection log (only if enabled in first_start.sh: COMPOSE_PROFILES=netlog in
  # .env). The hub image, with the host's network and NET_ADMIN to read the host's
  # connection table (conntrack): nothing to install on the host. Root-only files.
  netlog:
    image: ghcr.io/vehx35/jupydo-hub:${JUPYDO_HUB_TAG:-latest}
    container_name: jupydo-netlog
    profiles: ["netlog"]
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # which container has which address
      - /etc/localtime:/etc/localtime:ro # times in the server's time zone
      - ${JUPYDO_PATH:-/srv/JupyDo}/logs/network:/srv/jupydo-logs/network
    command: ["python3", "/opt/jupydo/jupydo-netlog.py", "--out", "/srv/jupydo-logs/network",
              "--retention-days", "${JUPYDO_NETLOG_DAYS:-365}"]
    restart: always

networks:
  jupyterhub_network:
    external: true # Indicates that the network is managed externally
     # uses a bridge network
             # This allows the JupyterHub service to communicate with other services on the same network
             # and provides isolation from other containers on the host.
